name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package App (ZIP)
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (Test-Path $buildDir) {
            Compress-Archive -Path "$buildDir\*" -DestinationPath "CodeStudioRecorder-Windows.zip" -Force
          }

      - name: Build Installer (Inno Setup)
        uses: scottmelhop/iscc-action@v1
        with:
          filepath: installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Development Build' }}
          files: |
            CodeStudioRecorder-Windows.zip
            build/installer/CodeStudioRecorder_Setup.exe
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
